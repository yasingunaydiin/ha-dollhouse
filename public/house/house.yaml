    name: Begane grond
    rooms:
      - {id: dining, name: Living Room, rect: [0, 0, 3.945, 3.48], floor: "#c9a47a"}
      - {id: living, name: Living Room, rect: [2.275, 3.48, 3.945, 5.39], floor: "#c9a47a"}
      - {id: kitchen, name: Kitchen, rect: [3.945, 0, 2.275, 3.48], floor: "#ddd6c8"}
      - {id: hallway_0, name: Hallway, rect: [0, 3.48, 2.275, 5.39], floor: "#d9d6cf"}
      # backyard: covered terrace, then lawn, borders and a gravel path up to the garage
      - {id: terrace, name: Terrace, rect: [0, -3.1, 6.22, 3.0], floor: "#7d6c66", outdoor: true}
      - {id: border_left, name: Garden, rect: [0, -11.1, 1.0, 8.0], floor: "#5d4a3a", outdoor: true}
      - {id: lawn, name: Garden, rect: [1.0, -11.1, 3.3, 8.0], floor: "#7fae5d", outdoor: true}
