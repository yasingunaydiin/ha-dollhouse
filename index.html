<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HA Dollhouse</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="bar">
      <span id="title"></span>
      <button id="mode" title="Switch between the real house and a simulation"></button>
      <label id="daynight" title="Time of day (simulated)">☀ <input type="range" min="0" max="24" step="0.25" value="13" /> <output>13:00</output> <select id="weather" title="Weather (simulated)"></select> <button id="now" type="button" title="Follow the real time, sun and weather at your location">Now</button></label>
      <button id="edit" title="Move, remove and add objects in 3D">Edit</button>
      <button id="plan" title="Floor-plan editor: walls, doors, windows, furniture">Plan</button>
      <button id="export" title="Download the whole house (layout, furniture, entity links) as one file">Export</button>
      <button id="import" title="Replace the house with one from an export file">Import</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden />
    </div>
    <aside id="floors">
      <button id="collapse" title="Show or hide the floor list"></button>
      <div id="views"></div>
    </aside>
    <aside id="editor" hidden>
      <div class="name"></div>
      <div class="row selection-only">
        <button class="rot-left" title="Rotate left (R)">⟲</button>
        <button class="rot-right" title="Rotate right (Shift+R)">⟳</button>
        <button class="delete" title="Remove (Delete)">Remove</button>
      </div>
      <div class="fields selection-only">
        <label>Turn (°)<input data-f="rot" type="number" step="15"></label>
        <label title="How far above the floor it sits, e.g. on a desk">Raise (m)<input data-f="y" type="number" step="0.05" min="0"></label>
        <label>Width (m)<input data-f="w" type="number" step="0.05" min="0.01"></label>
        <label>Depth (m)<input data-f="d" type="number" step="0.05" min="0.01"></label>
        <label>Height (m)<input data-f="h" type="number" step="0.05" min="0.01"></label>
        <button class="reset-size" title="Back to the model's own size">Original size</button>
      </div>
      <div class="row">
        <button class="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
        <button class="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
      </div>
      <div class="row">
        <select></select>
        <button class="add">Add</button>
      </div>
      <p>Drag to move · R to rotate · Delete to remove · Ctrl+Z to undo. Type a number to turn, raise or resize. Changes are saved as you go.</p>
    </aside>
    <div id="climate" class="modal" hidden></div>
    <div id="camera" class="modal" hidden></div>
    <div id="planner" hidden></div>
    <div id="toast"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
